<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GroceryGo Cloud API & Load Balancer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0F172A;
      color: #F8FAFC;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1E293B;
      border: 1px solid #334155;
      padding: 32px 40px;
      border-radius: 20px;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(16, 185, 129, 0.15);
      color: #10B981;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      color: #FFFFFF;
    }
    p {
      color: #94A3B8;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .endpoint {
      background: #0F172A;
      border: 1px solid #334155;
      padding: 10px 16px;
      border-radius: 10px;
      font-family: monospace;
      color: #38BDF8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Global Anycast Load Balancer Active</div>
    <h1>GroceryGo Platform API</h1>
    <p>High-concurrency microservices, automated driver dispatching, and webhook gateways are online and operational.</p>
    <div class="endpoint">GET /api/health</div>
  </div>
</body>
</html>

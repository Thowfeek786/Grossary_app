name: delivery_app
description: "GroceryGo Delivery Partner App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../../packages/core
  models:
    path: ../../packages/models
  repository:
    path: ../../packages/repository
  ui_kit:
    path: ../../packages/ui_kit
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  provider: ^6.1.2
  go_router: ^14.6.1
  image_picker: ^1.0.4
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^19.0.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.5.2
  shimmer: ^3.0.0
  google_maps_flutter: ^2.10.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logos/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logos/


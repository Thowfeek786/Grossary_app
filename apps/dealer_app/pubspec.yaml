name: dealer_app
description: "GroceryGo Dealer Hub"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../../packages/core
  models:
    path: ../../packages/models
  repository:
    path: ../../packages/repository
  ui_kit:
    path: ../../packages/ui_kit
  geocoding: ^3.0.0
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  provider: ^6.1.2
  go_router: ^14.6.1
  image_picker: ^1.0.4
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^19.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  shared_preferences: ^2.5.2
  pdf: ^3.11.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  google_maps_flutter: ^2.10.0
  audioplayers: ^6.1.0
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#0A0A0A"
  image: "assets/logos/splash_icon.png"
  color_dark: "#050505"
  image_dark: "assets/logos/splash_icon.png"
  android_12:
    color: "#0A0A0A"
    image: "assets/logos/splash_icon.png"
    color_dark: "#050505"
    image_dark: "assets/logos/splash_icon.png"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logos/

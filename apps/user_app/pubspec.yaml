name: user_app
description: "GroceryGo - Fresh Groceries Delivered to Your Door"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  core: any
  models: any
  repository:
    path: ../../packages/repository
  ui_kit:
    path: ../../packages/ui_kit
  geocoding: ^3.0.0
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0
  firebase_auth: ^6.3.0
  firebase_storage: ^13.2.0
  firebase_messaging: ^16.1.3
  provider: ^6.1.2
  go_router: ^17.1.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  flutter_staggered_animations: ^1.1.1
  carousel_slider: ^5.0.0
  badges: ^3.1.2
  shimmer: ^3.0.0
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

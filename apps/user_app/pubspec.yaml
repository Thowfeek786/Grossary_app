name: user_app
description: "GroceryGo - Fresh Groceries Delivered to Your Door"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../../packages/core
  models:
    path: ../../packages/models
  repository:
    path: ../../packages/repository
  ui_kit:
    path: ../../packages/ui_kit
  geocoding: ^3.0.0
  geolocator: ^11.1.0
  shared_preferences: ^2.5.2
  google_maps_flutter: ^2.5.3
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0
  firebase_auth: ^6.3.0
  firebase_storage: ^13.2.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^19.0.0
  google_sign_in: ^6.2.2
  provider: ^6.1.2
  go_router: ^17.1.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_plugin_android_lifecycle: ^2.0.24
  cupertino_icons: ^1.0.8
  flutter_staggered_animations: ^1.1.1
  carousel_slider: ^5.0.0
  badges: ^3.1.2
  shimmer: ^3.0.0
  lottie: ^3.3.1
  speech_to_text: ^7.3.0
  pdf: ^3.11.1
  printing: ^5.14.3
  url_launcher: ^6.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#1B5E20"
  image: "assets/logos/splash_icon.png"
  color_dark: "#0F381E"
  image_dark: "assets/logos/splash_icon.png"
  android_12:
    color: "#1B5E20"
    image: "assets/logos/splash_icon.png"
    color_dark: "#0F381E"
    image_dark: "assets/logos/splash_icon.png"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/auth_grocery_basket.png
    - assets/logos/
    - assets/logos/google.png
    - assets/icons/
